project_id = "staffstack"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/reset-password"]
minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = true
[auth.mfa]
max_enrolled_factors = 5
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[functions.send-payslips]
verify_jwt = true
[functions.delete-account]
verify_jwt = true
